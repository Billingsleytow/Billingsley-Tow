<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Billingsley Tow and Recovery</title>
    <style>
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        img { max-width: 100%; border-radius: 8px; }
        section { margin-bottom: 40px; }
    </style>
</head>
<body>

    <h1>Billingsley Tow and Recovery</h1>

    <section>
        <h2>Services & Equipment</h2>
        <div class="grid">
            <img src="truck-red.jpg" alt="Red Tow Truck">
            <img src="car-on-bed.jpg" alt="Car on flatbed">
            <img src="truck-side.jpg" alt="Truck side view">
            <img src="winch-detail.jpg" alt="Winch equipment">
            <img src="service-info.jpg" alt="Service information">
        </div>
    </section>

    <section>
        <h2>Our Fleet & Branding</h2>
        <div class="grid">
            <img src="chevy-truck.jpg" alt="Chevrolet truck">
            <img src="billingsley-shield.jpg" alt="Company logo shield">
        </div>
    </section>

    <section>
        <h2>Leave a Review</h2>
        <img src="review-qr.jpg" alt="Google Review QR code" style="width: 200px;">
    </section>

</body>
</html>
